name: Release

# Publie une version à chaque tag vX.Y.Z, ou à la demande depuis l'onglet Actions :
# images Docker sur GHCR, chart Helm et release GitHub.
# Une version avec suffixe (ex. 1.0.0-rc.1) est une prerelease et ne déplace pas le tag latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.1.0) : le tag est créé par la release"
        required: true

# Droits minimaux par défaut, élargis job par job
permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Vérification de la version
        id: check
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version invalide : $VERSION (attendu X.Y.Z ou X.Y.Z-suffixe, sans v)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Nom et étiquettes de l'image
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            # latest ne désigne que la dernière version stable
            if [[ "$PRERELEASE" == "false" ]]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Paquet du chart Helm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm package charts/zimbra-archivage --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Création de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          README="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/README.md"
          cat > notes.md <<NOTES
          ## Images Docker

          - \`${IMAGE}-backend:${VERSION}\`
          - \`${IMAGE}-frontend:${VERSION}\`

          ## Chart Helm

          \`zimbra-archivage-${VERSION}.tgz\`, joint à cette release.

          Installation, configuration et déploiement : voir le [README](${README}).
          NOTES
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" dist/*.tgz \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            "${FLAGS[@]}"
