name: Release

# Publie une version à chaque tag vX.Y.Z, ou à la demande depuis l'onglet Actions :
# images Docker sur GHCR, chart Helm et release GitHub
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (ex. 0.1.0) : le tag est créé par la release"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests du backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Vérification du frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Nom et version de l'image
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Paquet du chart Helm
        run: |
          VERSION="${TAG#v}"
          helm package charts/zimbra-archivage --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Création de la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<NOTES
          ## Images Docker

          - \`${IMAGE}-backend:${VERSION}\`
          - \`${IMAGE}-frontend:${VERSION}\`

          ## Tester en local avec Docker

          \`\`\`bash
          docker network create archivage
          docker run -d --name archivage-backend --network archivage \\
            -e ZIMBRA_SOAP_URL=https://mail.domaine.fr/service/soap \\
            -e ZIMBRA_REST_URL=https://mail.domaine.fr/service \\
            -e COOKIE_SECURE=false \\
            ${IMAGE}-backend:${VERSION}
          docker run -d --name archivage-frontend --network archivage -p 3000:3000 \\
            -e BACKEND_URL=http://archivage-backend:8000 \\
            ${IMAGE}-frontend:${VERSION}
          \`\`\`

          Puis ouvrir http://localhost:3000/

          ## Déployer avec Helm

          \`\`\`bash
          helm install archivage zimbra-archivage-${VERSION}.tgz \\
            --set zimbra.soapUrl=https://mail.domaine.fr/service/soap \\
            --set zimbra.restUrl=https://mail.domaine.fr/service \\
            --set ingress.enabled=true --set ingress.host=archivage.domaine.fr
          \`\`\`
          NOTES
          gh release create "$TAG" dist/*.tgz \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --prerelease
