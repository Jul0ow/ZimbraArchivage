name: CI

# Tests et vérifications à chaque push et pull request, réutilisés par la release
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (couverture minimale de 95 %)
        run: pytest --cov
      - name: Vulnérabilités connues des dépendances
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint et rendu des modèles
        run: |
          VALUES="--set zimbra.soapUrl=https://mail.example.fr/service/soap --set zimbra.restUrl=https://mail.example.fr/service"
          helm lint charts/zimbra-archivage $VALUES
          helm template test charts/zimbra-archivage $VALUES > /dev/null
          helm template test charts/zimbra-archivage $VALUES \
            --set ingress.enabled=true --set ingress.tls[0].secretName=tls \
            --set ingress.tls[0].hosts[0]=archivage.example.fr \
            --set networkPolicy.enabled=true > /dev/null
          helm template test charts/zimbra-archivage $VALUES \
            --set zimbra.proxy.url=http://user:pass@proxy.example.fr:3128 \
            --set zimbra.proxy.noProxy=localhost \
            --set networkPolicy.enabled=true \
            --set networkPolicy.extraEgress[0].ports[0].port=3128 > /dev/null
          helm template test charts/zimbra-archivage $VALUES \
            --set zimbra.proxy.existingSecret=proxy > /dev/null
