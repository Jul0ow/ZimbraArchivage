name: CI

# Tests et vérifications à chaque push et pull request, réutilisés par la release
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (couverture minimale de 95 %)
        run: pytest --cov
      - name: Vulnérabilités connues des dépendances
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: helm lint et rendu des modèles
        run: |
          VALUES="--set zimbra.soapUrl=https://mail.example.fr/service/soap --set zimbra.restUrl=https://mail.example.fr/service"
          helm lint charts/zimbra-archivage $VALUES
          helm template test charts/zimbra-archivage $VALUES > /dev/null
          helm template test charts/zimbra-archivage $VALUES \
            --set ingress.enabled=true --set ingress.tls[0].secretName=tls \
            --set ingress.tls[0].hosts[0]=archivage.example.fr \
            --set networkPolicy.enabled=true > /dev/null
