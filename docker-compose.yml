# Lancement rapide pour tester l'application :
#   cp .env.example .env    # puis renseigner les URLs du serveur Zimbra
#   docker compose up -d    # images publiées ; ajouter --build pour construire depuis les sources
#   ouvrir http://localhost:3000/
# L'application n'est publiée que sur la boucle locale : elle est servie en HTTP, et les
# mots de passe ne doivent pas circuler en clair sur le réseau.
name: zimbra-archivage

services:
  backend:
    image: ghcr.io/jul0ow/zimbraarchivage-backend:${ARCHIVAGE_VERSION:-latest}
    build: ./backend
    environment:
      ZIMBRA_SOAP_URL: ${ZIMBRA_SOAP_URL:?Renseigner ZIMBRA_SOAP_URL dans .env}
      ZIMBRA_REST_URL: ${ZIMBRA_REST_URL:?Renseigner ZIMBRA_REST_URL dans .env}
      VERIFY_TLS: ${VERIFY_TLS:-true}
      ZIMBRA_PROXY_URL: ${ZIMBRA_PROXY_URL:-}
      NO_PROXY: ${NO_PROXY:-}
      ZONE_ID: ${ZONE_ID:-Europe/Paris}
      SEARCH_BATCH_SIZE: ${SEARCH_BATCH_SIZE:-500}
      MAX_FILE_NAME_LENGTH: ${MAX_FILE_NAME_LENGTH:-50}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-4}
      # Facultatif : sans clé, les sessions sont perdues au redémarrage du backend
      SESSION_SECRET: ${SESSION_SECRET:-}
      # L'application est servie en HTTP sur le poste : le cookie ne peut pas être Secure
      COOKIE_SECURE: "false"
    read_only: true
    tmpfs:
      # En mémoire : taille bornée pour les .eml de plus de 10 Mo en cours de téléchargement
      - /tmp:size=512m
    healthcheck:
      # Forme chaîne (shell) plutôt que liste CMD : podman-compose interprète mal cette dernière
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ghcr.io/jul0ow/zimbraarchivage-frontend:${ARCHIVAGE_VERSION:-latest}
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${ARCHIVAGE_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /app/.next/cache
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
