{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zimbra-archivage.fullname" . }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # L'API est servie directement par le backend, sans passer par Next.js
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "zimbra-archivage.backendName" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zimbra-archivage.frontendName" . }}
                port:
                  name: http
{{- end }}
