apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimbra-archivage.backendName" . }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.zimbra.proxy.url (not .Values.zimbra.proxy.existingSecret) }}
        checksum/proxy: {{ include (print $.Template.BasePath "/proxy-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # L'application n'utilise pas l'API Kubernetes : pas de jeton monté dans le conteneur
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "zimbra-archivage.backendName" . }}
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimbra-archivage.sessionSecretName" . }}
                  key: SESSION_SECRET
            {{- with include "zimbra-archivage.proxySecretName" . }}
            - name: ZIMBRA_PROXY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ if $.Values.zimbra.proxy.existingSecret }}{{ $.Values.zimbra.proxy.existingSecretKey }}{{ else }}ZIMBRA_PROXY_URL{{ end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          {{- include "zimbra-archivage.probes" (dict "path" "/api/health" "values" .Values.backend) | nindent 10 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # Les .eml de plus de 10 Mo transitent par un fichier temporaire
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.backend.tmpSizeLimit }}
      {{- include "zimbra-archivage.scheduling" .Values.backend | nindent 6 }}
---
{{ include "zimbra-archivage.service" (dict "root" . "component" "backend" "name" (include "zimbra-archivage.backendName" .) "values" .Values.backend) }}
