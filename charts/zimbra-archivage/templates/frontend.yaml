apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimbra-archivage.frontendName" . }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      # L'application n'utilise pas l'API Kubernetes : pas de jeton monté dans le conteneur
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            # Utilisé par le relais /api/* de Next.js quand l'ingress ne route pas /api directement
            - name: BACKEND_URL
              value: "http://{{ include "zimbra-archivage.backendName" . }}:{{ .Values.backend.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          {{- include "zimbra-archivage.probes" (dict "path" "/" "values" .Values.frontend) | nindent 10 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Cache de Next.js, le système de fichiers racine étant en lecture seule
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
      {{- include "zimbra-archivage.scheduling" .Values.frontend | nindent 6 }}
---
{{ include "zimbra-archivage.service" (dict "root" . "component" "frontend" "name" (include "zimbra-archivage.frontendName" .) "values" .Values.frontend) }}
