{{- if and .Values.zimbra.proxy.url (not .Values.zimbra.proxy.existingSecret) }}
# URL du proxy vers Zimbra : elle peut contenir un mot de passe
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zimbra-archivage.proxySecretName" . }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
type: Opaque
data:
  ZIMBRA_PROXY_URL: {{ .Values.zimbra.proxy.url | b64enc | quote }}
{{- end }}
