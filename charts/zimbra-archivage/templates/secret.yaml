{{- if not .Values.session.existingSecret }}
{{- $name := include "zimbra-archivage.sessionSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.session.secret }}
{{- if and (not $key) $existing }}
{{- $key = index $existing.data "SESSION_SECRET" | b64dec }}
{{- end }}
{{- if not $key }}
{{- /* Clé Fernet : 32 octets aléatoires en base64 urlsafe */}}
{{- $key = randAscii 32 | b64enc | replace "+" "-" | replace "/" "_" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
  annotations:
    # Conservé à la désinstallation : les sessions restent valides après une réinstallation
    helm.sh/resource-policy: keep
type: Opaque
data:
  SESSION_SECRET: {{ $key | b64enc | quote }}
{{- end }}
