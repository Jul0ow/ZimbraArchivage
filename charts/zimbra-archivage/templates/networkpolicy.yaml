{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zimbra-archivage.backendName" . }}
  labels:
    {{- include "zimbra-archivage.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Le backend n'est joignable que par l'ingress-controller et par le frontend
    - from:
        - {{- toYaml .Values.networkPolicy.ingressControllerSelector | nindent 10 }}
        - podSelector:
            matchLabels:
              {{- include "zimbra-archivage.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - port: http
  egress:
    # Résolution DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Serveur Zimbra (SOAP et ReST)
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
      {{- with .Values.networkPolicy.zimbraEgress }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
